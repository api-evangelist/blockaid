          additionalProperties:
            additionalProperties:
              type: string
            type: object
          type: object
          title: Total Usd Exposure
          description: a dictionary representing the usd value each address is exposed to, split by spenders
        address_details:
          additionalProperties:
            $ref: '#/components/schemas/routers__tron__response__AddressDetails'
          type: object
          title: Address Details
          description: a dictionary including additional information about each relevant address in the transaction.
        account_summary:
          allOf:
          - $ref: '#/components/schemas/routers__tron__response__AccountSummary'
          title: Account Summary
          description: Account summary for the account address. account address is determined implicit by the `from` field in the transaction request, or explicit by the account_address field in the request.
        params:
          allOf:
          - $ref: '#/components/schemas/routers__tron__response__JsonRPCParams'
          title: Params
          description: The parameters of the transaction that was simulated.
        contract_management:
          additionalProperties:
            items:
              anyOf:
              - $ref: '#/components/schemas/routers__tron__response__ProxyUpgradeManagement'
              - $ref: '#/components/schemas/routers__tron__response__OwnershipChangeManagement'
              - $ref: '#/components/schemas/routers__tron__response__ModulesChangeManagement'
              - $ref: '#/components/schemas/routers__tron__response__SetCodeAccountManagement'
              - $ref: '#/components/schemas/routers__tron__response__ContractCreation'
            type: array
          type: object
          title: Contract Management
          description: Describes the state differences as a result of this transaction for every involved address
        session_key:
          additionalProperties:
            items:
              $ref: '#/components/schemas/routers__tron__session_keys__SessionKey'
            type: array
          type: object
          title: Session Key
          description: Session keys created in this transaction per address
