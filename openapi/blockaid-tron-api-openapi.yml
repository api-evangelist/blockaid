          type: object
          title: Assets Diffs
          description: dictionary describes the assets differences as a result of this transaction for every involved address
        transaction_actions:
          items:
            anyOf:
            - $ref: '#/components/schemas/routers__tron__response__TransactionAction'
            - type: string
