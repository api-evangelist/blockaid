          type: string
          title: Description
      type: object
      required:
      - type
      - feature_id
      - description
      title: AddressFeatureModel
    TransactionHint:
      oneOf:
      - $ref: '#/components/schemas/CrossChainBridgeHint'
      - $ref: '#/components/schemas/GenericTransactionHint'
      discriminator:
        propertyName: type
        mapping:
          cross_chain_bridge: '#/components/schemas/CrossChainBridgeHint'
      title: TransactionHint
      description: A single customer-supplied hint about transaction intent. The `type` field identifies which hint variant this is.
    CrossChainBridgeNativeAsset:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          const: NATIVE
          title: Type
          description: Type of the asset (`NATIVE`)
          default: NATIVE
        raw_value:
          type: string
          description: Amount to be received in the asset's smallest unit (before decimal division), e.g. wei for ETH.
      title: CrossChainBridgeNativeAsset
    TransactionHints:
      type: array
      items:
        $ref: '#/components/schemas/TransactionHint'
      title: TransactionHints
      description: Customer-supplied hints about transaction intent that cannot be derived from on-chain simulation alone. Each element is a typed hint identified by its `type` field.
  securitySchemes:
    APIKey:
      type: apiKey
      name: X-API-Key
      in: header
    ClientID:
      type: apiKey
      name: X-CLIENT-ID
      in: header
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer authentication header of the form `Bearer <token>`, where `<token>` is your auth token. See [API Authentication](/docs/api-reference/before-you-begin/api-authentication) for how to retrieve it.
