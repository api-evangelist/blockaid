tags:
- name: Asset Management
paths:
  /v0/platform/assets/:
    post:
      tags:
      - Asset Management
      summary: Create Asset
      description: Create an asset for the given address or domain. The new asset will be onboarded to the platform's inventory and monitored according to your monitoring policy.
