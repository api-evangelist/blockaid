                        name: from
                        type: address
                      - internalType: address
                        name: to
                        type: address
                      - internalType: uint256
                        name: amount
                        type: uint256
                      name: transferFrom
                      outputs:
                      - internalType: bool
                        name: ''
                        type: bool
                      stateMutability: nonpayable
                      type: function
                    - inputs:
                      - internalType: address[]
                        name: users
                        type: address[]
                      name: unfreezeUsers
                      outputs: []
                      stateMutability: nonpayable
                      type: function
              create sui example:
                summary: Create Sui Address Example
                value:
                  identifier_type: address
                  identifier: '0xe1b45a0e641b9955a20aa0ad1c1f4ad86aad8afb07296d4085e349a50e90bdca'
                  tags:
                  - example
                  alias: bluefin
                  runtime: sui
                  chain_name: mainnet
                  package_interface: []
              Create Hyperliquid Address:
                summary: Create Hyperliquid (Perps) Address Example
                value:
                  identifier_type: address
                  identifier: '0xabcde12345abcde12345abcde12345abcde12345'
                  tags:
                  - example
                  alias: my-hyperliquid-vault
                  chain_name: hyperliquid
              Create Polymarket Address:
                summary: Create Polymarket (Markets) Address Example
                value:
                  identifier_type: address
                  identifier: '0xabcde12345abcde12345abcde12345abcde12345'
                  tags:
                  - example
                  alias: my-polymarket-contract
                  chain_name: polymarket
              Create Domain:
                summary: Create Domain Example
                value:
                  identifier_type: domain
                  identifier: example.com
                  tags:
                  - example
                  alias: Example Domain
        required: true
      responses:
        '200':
          description: Asset created successfully
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AddressResponse'
                - $ref: '#/components/schemas/DomainResponse'
                - $ref: '#/components/schemas/PerpResponse'
                - $ref: '#/components/schemas/MarketResponse'
                items:
                  anyOf:
                  - $ref: '#/components/schemas/AddressResponse'
                  - $ref: '#/components/schemas/DomainResponse'
                  - $ref: '#/components/schemas/PerpResponse'
                  - $ref: '#/components/schemas/MarketResponse'
                type: array
                title: Response 200 Create-Asset
              examples:
                Address:
                  summary: Address Asset Created
                  value:
                  - identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                    identifier_type: address
                    alias: Bedrock
                    tags:
                    - example
                    added_by: user@example.com
                    created_at: '2025-01-15T12:00:00Z'
                    address_details:
                      chain: bsc
                      runtime: evm
                      properties: []
                      address: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                Domain:
                  summary: Domain Asset Created
                  value:
                  - identifier: example.com
                    identifier_type: domain
                    alias: Example Domain
                    tags: []
                    added_by: user@example.com
                    created_at: '2025-01-15T12:00:00Z'
        '409':
          description: Asset already exists
          content:
            application/json:
              examples:
                Duplicate Address:
                  summary: Address Already Exists
                  value:
                    detail: Failed to add address because one or more already exists
                Duplicate Domain:
                  summary: Domain Already Exists
                  value:
                    detail: Failed to add domain because it already exists in the inventory
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetErrorResponse'
              examples:
                Type Mismatch:
                  summary: Type Mismatch Error
                  value:
                    error_code: type_mismatch
                    description: Only domain and address identifier types are valid.
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                Generic Error:
                  summary: Generic Error During Creation
                  value:
                    error_code: generic_error
                    description: Failed to create monitored asset.
                Missing ABI:
                  summary: Missing ABI Error
                  value:
                    error_code: missing_abi
                    description: Failed to auto-fetch contract interface, please provide the interface json while creating the asset
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                Implementation Missing ABI:
                  summary: Implementation Missing ABI Error
                  value:
                    error_code: implementation_missing_abi
                    description: Failed to auto-fetch contract interface for the implementation of the proxy, please provide both the proxy and implementation's interface json while creating the asset
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                Unsupported Runtime:
                  summary: Unsupported Runtime Error
                  value:
                    error_code: unsupported_runtime
                    description: Unsupported runtime solana.
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              examples:
                Missing Required Field:
                  summary: Missing Required Field
                  value:
                    detail:
                    - loc:
                      - body
                      - identifier
                      msg: field required
                      type: value_error.missing
                Invalid Identifier Type:
                  summary: Invalid Identifier Type
                  value:
                    detail:
                    - loc:
                      - body
                      - identifier_type
                      msg: 'value is not a valid enumeration member; permitted: ''address'', ''domain'''
                      type: type_error.enum
      deprecated: false
      security:
      - APIKey: []
      - ClientID: []
      - JWT: []
  /v0/platform/assets/{identifier}:
    get:
      tags:
      - Asset Management
      summary: Get Asset
      description: Retrieve details for an asset in your inventory by its identifier, runtime, and chain.
      operationId: get-asset
      parameters:
      - description: The contract address or domain that identifies this asset.
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: Identifier
        example: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        name: identifier
        in: path
      - description: The chain type (e.g. evm, solana). Use the same runtime you used when creating the asset.
        required: true
        deprecated: false
        explode: false
        schema:
          allOf:
          - $ref: '#/components/schemas/MonitoringSupportedRuntimes'
        example: evm
        name: runtime
        in: query
        allowEmptyValue: false
        allowReserved: false
      - description: Which chain the asset is on (e.g. bsc, ethereum). Use the same chain you used when creating the asset.
        required: true
        deprecated: false
        explode: false
        schema:
          allOf:
          - $ref: '#/components/schemas/MonitoringSupportedChains'
        example: bsc
        name: chain_name
        in: query
        allowEmptyValue: false
        allowReserved: false
      responses:
        '200':
          description: Successful response with the asset details (address or domain).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AddressResponse'
                - $ref: '#/components/schemas/DomainResponse'
                - $ref: '#/components/schemas/PerpResponse'
                - $ref: '#/components/schemas/MarketResponse'
                title: Response 200 Get-Asset
              examples:
                Address Asset:
                  summary: Address Asset Retrieved
                  value:
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                    identifier_type: address
                    alias: Bedrock
                    tags:
                    - example
                    added_by: API
                    created_at: '2025-07-14T20:10:58.180233'
                    address_details:
                      chain: bsc
                      runtime: evm
                      properties:
                      - token
                      - address
                      - erc20
                      - contract
                      address: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        '404':
          description: No asset exists for the given identifier, runtime, and chain combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetErrorResponse'
              examples:
                Not Found:
                  summary: Asset Not Found
                  value:
                    error_code: not_found
                    description: Asset not found
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        '422':
          description: Request validation failed (e.g. missing or invalid query parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              examples:
                Missing Required Query:
                  summary: Missing Required Query Parameter
                  value:
                    detail:
                    - loc:
                      - query
                      - runtime
                      msg: field required
                      type: value_error.missing
                Invalid Runtime:
                  summary: Invalid Runtime Value
                  value:
                    detail:
                    - loc:
                      - query
                      - runtime
                      msg: 'value is not a valid enumeration member; permitted: ''evm'', ''solana'', ...'
                      type: type_error.enum
      deprecated: false
      security:
      - APIKey: []
      - ClientID: []
      - JWT: []
    delete:
      tags:
      - Asset Management
      summary: Delete Asset
      description: Remove an asset from your inventory by its identifier, runtime, and chain. The asset is removed from monitoring and related detection rules.
      operationId: delete-asset
      parameters:
      - description: The contract address or domain that identifies this asset.
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: Identifier
        example: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        name: identifier
        in: path
      - description: The chain type (e.g. evm, solana). Use the same runtime you used when creating the asset.
        required: true
        deprecated: false
        explode: false
        schema:
          allOf:
          - $ref: '#/components/schemas/MonitoringSupportedRuntimes'
        example: evm
        name: runtime
        in: query
        allowEmptyValue: false
        allowReserved: false
      - description: Which chain the asset is on (e.g. bsc, ethereum). Use the same chain you used when creating the asset.
        required: true
        deprecated: false
        explode: false
        schema:
          allOf:
          - $ref: '#/components/schemas/MonitoringSupportedChains'
        example: bsc
        name: chain_name
        in: query
        allowEmptyValue: false
        allowReserved: false
      responses:
        '200':
          description: Successful response; the asset has been removed from the inventory.
          content:
            application/json:
              schema:
                type: object
                description: Empty body. The asset has been removed from the inventory.
                additionalProperties: false
              examples:
                Success:
                  summary: Asset Deleted
                  value: {}
        '404':
          description: No asset exists for the given identifier, runtime, and chain combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetErrorResponse'
              examples:
                Not Found:
                  summary: Asset Not Found
                  value:
                    error_code: not_found
                    description: Asset not found
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        '422':
          description: Request validation failed (e.g. missing or invalid query parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              examples:
                Missing Required Query:
                  summary: Missing Required Query Parameter
                  value:
                    detail:
                    - loc:
                      - query
                      - runtime
                      msg: field required
                      type: value_error.missing
                Invalid Runtime:
                  summary: Invalid Runtime Value
                  value:
                    detail:
                    - loc:
                      - query
                      - runtime
                      msg: 'value is not a valid enumeration member; permitted: ''evm'', ''solana'', ...'
                      type: type_error.enum
      deprecated: false
      security:
      - APIKey: []
      - ClientID: []
      - JWT: []
    patch:
      tags:
      - Asset Management
      summary: Update an Asset
      description: Update an existing asset in your inventory (e.g. alias, tags) by its identifier, runtime, and chain.
      operationId: patch-asset
      parameters:
      - description: The contract address or domain that identifies this asset.
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: Identifier
        example: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        name: identifier
        in: path
      - description: The chain type (e.g. evm, solana). Use the same runtime you used when creating the asset.
        required: true
        deprecated: false
        explode: false
        schema:
          allOf:
          - $ref: '#/components/schemas/MonitoringSupportedRuntimes'
        example: evm
        name: runtime
        in: query
        allowEmptyValue: false
        allowReserved: false
      - description: Which chain the asset is on (e.g. bsc, ethereum). Use the same chain you used when creating the asset.
        required: true
        deprecated: false
        explode: false
        schema:
          allOf:
          - $ref: '#/components/schemas/MonitoringSupportedChains'
        example: bsc
        name: chain_name
        in: query
        allowEmptyValue: false
        allowReserved: false
      requestBody:
        description: Fields to update (alias, tags). Include identifier, runtime, and chain_name to match the path and query.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdateRequest'
            examples:
              Update Address:
                summary: Update Address Example
                value:
                  identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                  tags:
                  - example
                  - new_tag
                  chain_name: bsc
                  runtime: evm
        required: true
      responses:
        '200':
          description: Successful response with the updated asset details (address or domain).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AddressResponse'
                - $ref: '#/components/schemas/DomainResponse'
                - $ref: '#/components/schemas/PerpResponse'
                - $ref: '#/components/schemas/MarketResponse'
                title: Response 200 Patch-Asset
              examples:
                not_found:
                  summary: Asset not found
                  value:
                    error_code: not_found
                    description: Asset not found
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        '404':
          description: No asset exists for the given identifier, runtime, and chain combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetErrorResponse'
              examples:
                Not Found:
                  summary: Asset Not Found
                  value:
                    error_code: not_found
                    description: Asset not found
                    identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
        '422':
          description: Request validation failed (e.g. missing or invalid query or body parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              examples:
                Missing Required Query:
                  summary: Missing Required Query Parameter
                  value:
                    detail:
                    - loc:
                      - query
                      - chain_name
                      msg: field required
                      type: value_error.missing
                Invalid Body Field:
                  summary: Invalid Request Body Field
                  value:
                    detail:
                    - loc:
                      - body
                      - tags
                      msg: value is not a valid list
                      type: type_error.list
      deprecated: false
      security:
      - APIKey: []
      - ClientID: []
      - JWT: []
  /v0/platform/assets/search:
    post:
      summary: Search Assets
      deprecated: false
      description: Search and filter platform assets (addresses/domains) using structured filters, pagination, and sorting.
      tags:
      - Asset Management
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  properties:
                    identifier_type:
                      type: array
                      items:
                        type: string
                        enum:
                        - address
                        - domain
                      description: Return only results matching the specified asset identifier type (blockchain address or domain).
                    chain:
                      $ref: '#/components/schemas/APIFilters'
                      description: Return only results that match the specified blockchain network filter.
                    tags:
                      $ref: '#/components/schemas/APIFilters'
                      description: Return only results that match the specified tag filter.
                    name:
                      $ref: '#/components/schemas/APIFilters'
                      description: Return only results that match the specified asset name filter.
                  description: A set of fields used to filter asset search results.
                page_size:
                  type: integer
                  default: 50
                  description: Determine how many results are returned per page.
                page:
                  type: integer
                  description: Return only results for the specified page number.
                sort:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Which field to sort results by.
                        enum:
                        - identifier
                        - created_at
                      operator:
                        type: string
                        description: 'Sort order: ascending or descending.'
                        enum:
                        - asc
                        - desc
                    required:
                    - field
                    - operator
                  description: Sort results based on the specified rules.
              required:
              - sort
            examples:
              Search By Chain:
                summary: Search assets by chain
                value:
                  filter:
                    identifier_type:
                    - address
                    chain:
                      eq: ethereum
                  page_size: 25
                  page: 1
                  sort:
                  - field: created_at
                    operator: desc
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of results matching the request.
                  page:
                    type: integer
                    description: Current page number returned. This is relevant only if a specific page number was mentioned in the request.
                  pages:
                    type: integer
                    description: Total number of pages available.
                  size:
                    type: integer
                    description: Number of items returned in the current response.
                  items:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/AddressResponse'
                      - $ref: '#/components/schemas/DomainResponse'
                    description: List of assets returned in the response.
                required:
                - total
                - items
                - pages
                - page
                - size
                description: Successful response containing paginated search results.
              example:
                total: 1
                page: 1
                pages: 1
                size: 1
                items:
                - identifier: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
                  identifier_type: address
                  alias: Bedrock
                  tags:
                  - example
                  added_by: API
                  created_at: '2025-07-14T20:10:58.180233'
                  address_details:
                    chain: ethereum
                    runtime: evm
                    address: '0xFf7d6A96ae471BbCD7713aF9CB1fEeB16cf56B41'
          headers: {}
      security:
      - APIKey: []
      - ClientID: []
      - JWT: []
