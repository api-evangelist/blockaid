          description: The asset type.
        identifier:
          type: string
          title: Identifier
          description: The perp identifier (e.g. "btc-usdc").
        asset_id:
          type: string
        alias:
          type: string
          title: Alias
          description: The alias of the asset.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags assigned to this asset.
        added_by:
          type: string
          title: Added By
          description: The user who added the asset.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time the asset was created.
        address_details:
          $ref: '#/components/schemas/BaseAddressDetails'
      type: object
      required:
      - identifier
      - tags
      - added_by
      - created_at
      - address_details
      - identifier_type
      - asset_id
      title: PerpResponse
