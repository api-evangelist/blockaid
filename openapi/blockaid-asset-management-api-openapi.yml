components:
  schemas:
    BaseAddressDetails:
      properties:
        chain:
          type: string
          title: Chain
          description: The chain of the asset.
        runtime:
          allOf:
          - $ref: '#/components/schemas/MonitoringSupportedRuntimes'
          description: The runtime of the asset.
        properties:
          items:
            type: string
          type: array
          title: Properties
          description: The properties list of the asset.
        address:
          type: string
          title: Address
          description: The address of the asset.
      type: object
      required:
      - chain
      - runtime
      - properties
      - address
      title: BaseAddressDetails
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    APIFilters:
      title: API Filters
      anyOf:
      - title: Equals Filter
        description: Filter by exact value match.
        type: object
        properties:
          eq:
            type: string
            description: Return only results where the field equals this value.
        required:
        - eq
      - title: In List Filter
        description: Filter by matching any value in a list.
        type: object
        properties:
          in:
            type: array
            items:
              type: string
            description: Return only results where the field matches any value in this list.
        required:
        - in
      - title: Contains All Filter
        description: Filter by requiring all listed values to be present.
        type: object
        properties:
          contains_all:
            type: array
            items:
              type: string
            description: Return only results where the field contains all values in this list.
        required:
        - contains_all
      - title: Contains Filter
        description: Filter by substring match.
        type: object
        properties:
          contains:
            type: string
            description: Return results where the field contains the given value (substring match).
        required:
        - contains
      description: A filter object that supports common query operators.
    ABIFallback:
      properties:
        type:
          type: string
          enum:
          - fallback
          title: Type
        stateMutability:
          type: string
          enum:
          - nonpayable
          - payable
          title: Statemutability
      type: object
      required:
      - type
      title: ABIFallback
    DomainResponse:
      properties:
        identifier_type:
          type: string
          enum:
          - domain
          title: Identifier Type
          default: domain
          description: The asset type.
        identifier:
          type: string
          title: Identifier
          description: The domain name for this asset.
        asset_id:
          type: string
        alias:
          type: string
          title: Alias
          description: The alias of the asset.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags assigned to the asset.
        added_by:
          type: string
          title: Added By
          description: The user who added the asset.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time the asset was created.
      type: object
      required:
      - identifier
      - tags
      - added_by
      - created_at
      - identifier_type
      - asset_id
      title: DomainResponse
    ABIFunction:
      properties:
        type:
          type: string
          enum:
          - function
          title: Type
        name:
          type: string
          title: Name
        inputs:
          items:
            $ref: '#/components/schemas/ABIParameter'
          type: array
          title: Inputs
        outputs:
          items:
            $ref: '#/components/schemas/ABIParameter'
          type: array
          title: Outputs
        stateMutability:
          type: string
          enum:
          - pure
          - view
          - nonpayable
          - payable
          title: Statemutability
        constant:
          type: boolean
          title: Constant
        payable:
          type: boolean
          title: Payable
      type: object
      required:
      - type
      - name
      - stateMutability
      title: ABIFunction
    ABIEvent:
      properties:
        type:
          type: string
          enum:
          - event
          title: Type
        name:
          type: string
          title: Name
        inputs:
          items:
            $ref: '#/components/schemas/ABIParameter'
          type: array
          title: Inputs
        anonymous:
          type: boolean
          title: Anonymous
          default: false
      type: object
      required:
      - type
      - name
      title: ABIEvent
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ABIParameter:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        internalType:
          type: string
          title: Internaltype
        components:
          items:
            $ref: '#/components/schemas/ABIParameter'
          type: array
          title: Components
      type: object
      required:
      - name
      - type
      title: ABIParameter
    MarketResponse:
      properties:
        identifier_type:
          type: string
          enum:
          - market
          title: Identifier Type
          default: market
          description: The asset type.
        identifier:
          type: string
          title: Identifier
          description: The market slug for this asset.
        asset_id:
          type: string
        alias:
          type: string
          title: Alias
          description: The alias of the asset.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags assigned to this asset.
        added_by:
          type: string
          title: Added By
          description: The user who added the asset.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time the asset was created.
        address_details:
          $ref: '#/components/schemas/BaseAddressDetails'
      type: object
      required:
      - identifier
      - tags
      - added_by
      - created_at
      - address_details
      - identifier_type
      - asset_id
      title: MarketResponse
    PerpResponse:
      properties:
