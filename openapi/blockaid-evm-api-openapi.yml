        options:
          items:
            $ref: '#/components/schemas/routers__evm__models__ValidationOptions'
          type: array
          minItems: 1
          uniqueItems: true
          description: List of one or more of options for the desired output. "simulation" - include simulation output in your response. "validation" - include security validation of the transaction in your response. "gas_estimation" - include gas estimation result in your response. Default is ["validation"]
          default:
          - validation
        metadata:
          allOf:
          - $ref: '#/components/schemas/ScanRequestMetadata'
