          description: Additional context for the scan (e.g., dapp URL/domain, integration source). Used to enrich results and reduce false positives/negatives.
        block:
          anyOf:
          - type: integer
          - type: string
            pattern: ^(0[Xx][0-9A-Fa-f]+|-?[1-9][0-9]*|latest)$
          title: Block
          description: The relative block for the block validation. Can be "latest" or a block number.
          default: latest
        state_override:
          additionalProperties:
            $ref: '#/components/schemas/routers__evm__models__AddressStateOverride'
          type: object
          title: State Override
          description: Override the state of the chain. This is useful for testing purposes.
        simulate_with_estimated_gas:
          type: boolean
          title: Simulate With Estimated Gas
          description: Simulate transactions using gas estimation result. This requires "gas_estimation" option to be enabled.
          default: false
