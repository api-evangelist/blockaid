        ip_address:
          type: string
          format: ipvanyaddress
          title: Ip Address
          description: IP address of the customer making the request. Both IPv4 and IPv6 addresses are supported.
      type: object
      required:
      - user_agent
      - ip_address
      title: Connection
    Exposure:
      properties:
        raw_value:
          type: string
          title: Raw Value
