components:
  schemas:
    UserOperationV7:
      properties:
        sender:
          type: string
          pattern: ^(0x[0-9A-Fa-f]{40})$
          title: Sender
          description: The sender address of the operation in hex string format
          default: 0x
        nonce:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*)$
          title: Nonce
          description: The nonce value in hex string format.
          default: '0x0'
        init_code:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*)$
          title: Init Code
          description: The init code value in hex string format.
          default: 0x
        call_data:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*)$
          title: Call Data
          description: The call data value in hex string format.
          default: 0x
        pre_verification_gas:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*)$
          title: Pre Verification Gas
          description: The pre verification gas value in hex string format.
          default: '0x0'
        paymaster_and_data:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*)$
          title: Paymaster And Data
          description: The paymaster and data value in hex string format.
          default: 0x
        signature:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*|)$
          title: Signature
          description: The signature value in hex string format.
        account_gas_limits:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*)$
          title: Account Gas Limits
          description: The account gas limits value in hex string format.
          default: '0x0'
        gas_fees:
          type: string
          pattern: ^(0x[0-9A-Fa-f]*)$
          title: Gas Fees
          description: The gas fees value in hex string format.
          default: '0x0'
        eip7702_auth:
          allOf:
          - $ref: '#/components/schemas/Authorization'
          title: Eip7702 Auth
          description: The EIP-7702 authorization tuple for the user operation (optional)
      type: object
      title: UserOperationV7
    routers__evm__response__ERC20BalanceChanges:
      properties:
        before:
          allOf:
          - $ref: '#/components/schemas/routers__evm__response__ERC20Diff'
          title: Before
          description: balance of the account before making the transaction
        after:
          allOf:
          - $ref: '#/components/schemas/routers__evm__response__ERC20Diff'
          title: After
          description: balance of the account after making the transaction
      type: object
      required:
      - before
      - after
      title: ERC20BalanceChanges
    routers__evm__token_details__NativeAssetDetails:
      properties:
        type:
          type: string
          enum:
          - NATIVE
          title: Type
          description: asset type.
        name:
          type: string
          title: Name
          description: string represents the name of the asset
        symbol:
          type: string
          title: Symbol
          description: asset's symbol name
        chain_name:
          type: string
          title: Chain Name
        chain_id:
          type: integer
          title: Chain Id
        decimals:
          type: integer
          title: Decimals
        logo_url:
          type: string
          title: Logo Url
      type: object
      required:
      - type
      - chain_name
      - chain_id
      - decimals
      - logo_url
      title: NativeAssetDetails
    routers__evm__response__ERC1155Asset:
      properties:
        type:
          type: string
          enum:
          - ERC1155
          title: Type
          description: The type of the model
        token_id:
          type: integer
          title: Token Id
          description: Token Id
        details:
          allOf:
          - $ref: '#/components/schemas/routers__evm__token_details__ERC1155TokenDetails'
          title: Details
          description: Details
      type: object
      required:
      - type
      - token_id
      - details
      title: ERC1155Asset
    TransactionReportParams:
      properties:
        chain:
          allOf:
          - $ref: '#/components/schemas/TransactionScanSupportedChains'
          description: The chain name
        account_address:
          type: string
          title: Account Address
          description: The address to relate the transaction to. Account address determines in which perspective the transaction is simulated and validated.
        data:
          anyOf:
          - $ref: '#/components/schemas/routers__evm__transaction__models__Transaction'
          - $ref: '#/components/schemas/JsonRpc'
          format: json
          title: Data
          description: Transaction parameters
        metadata:
          allOf:
          - $ref: '#/components/schemas/ScanRequestMetadata'
          title: Metadata
          description: Additional context for the scan (e.g., dapp URL/domain, integration source). Used to enrich results and reduce false positives/negatives.
      type: object
      required:
      - chain
      - account_address
      - data
      - metadata
      title: TransactionReportParams
    routers__evm__models__ValidationOptions:
      type: string
      enum:
      - validation
      - simulation
      - gas_estimation
      - events
      title: ValidationOptions
      description: Response sections to include (e.g., validation, simulation, gas estimation, events).
    routers__evm__session_keys__Condition:
      type: string
      enum:
      - UNCONSTRAINED
      - EQUAL
      - GREATER
      - LESS
      - GREATER_OR_EQUAL
      - LESS_OR_EQUAL
      - NOT_EQUAL
      title: Condition
      description: Comparison operator used to evaluate an argument/value against a policy constraint.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    routers__evm__models__TransactionScanEvent:
      properties:
        emitter_address:
          type: string
          title: Emitter Address
        emitter_name:
          type: string
          title: Emitter Name
        name:
          type: string
          title: Name
        params:
          items:
            $ref: '#/components/schemas/routers__evm__models__TransactionScanLogParamInfo'
          type: array
          title: Params
        topics:
          items:
            type: string
          type: array
          title: Topics
        data:
          type: string
          title: Data
      type: object
      required:
      - emitter_address
      - topics
      - data
      title: TransactionScanEvent
    routers__evm__response__NativeAddressAssetDiff:
      properties:
        asset_type:
          type: string
          enum:
          - NATIVE
          title: Asset Type
          description: type of the asset for the current diff
        asset:
          allOf:
          - $ref: '#/components/schemas/routers__evm__token_details__NativeAssetDetails'
          title: Asset
          description: description of the asset for the current diff
        in:
          items:
            $ref: '#/components/schemas/routers__evm__response__NativeDiff'
          type: array
          title: In
          description: amount of the asset that was transferred to the address in this transaction
