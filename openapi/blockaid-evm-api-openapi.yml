          - $ref: '#/components/schemas/ChainParam'
          title: Chain
          description: The chain name or chain ID
        options:
          items:
            $ref: '#/components/schemas/routers__evm__models__ValidationOptions'
          type: array
          minItems: 1
          uniqueItems: true
          description: List of one or more of options for the desired output. "simulation" - include simulation output in your response. "validation" - include security validation of the transaction in your response. "gas_estimation" - include gas estimation result in your response. Default is ["validation"]
          default:
          - validation
        metadata:
          allOf:
          - $ref: '#/components/schemas/ScanRequestMetadata'
          title: Metadata
          description: Additional context for the scan (e.g., dapp URL/domain, integration source). Used to enrich results and reduce false positives/negatives.
        block:
          anyOf:
          - type: integer
          - type: string
            pattern: ^(0[Xx][0-9A-Fa-f]+|-?[1-9][0-9]*|latest)$
          title: Block
          description: The relative block for the block validation. Can be "latest" or a block number.
          default: latest
        state_override:
          additionalProperties:
            $ref: '#/components/schemas/routers__evm__models__AddressStateOverride'
          type: object
          title: State Override
          description: Override the state of the chain. This is useful for testing purposes.
        simulate_with_estimated_gas:
          type: boolean
          title: Simulate With Estimated Gas
          description: Simulate transactions using gas estimation result. This requires "gas_estimation" option to be enabled.
          default: false
        account_address:
          type: string
          title: Account Address
          description: The address to relate the transaction to. Account address determines in which perspective the transaction is simulated and validated.
        data:
          type: string
          pattern: ^0[Xx][0-9A-Fa-f]+$
          title: Data
          description: Hex string of the raw transaction data
        transaction_hints:
          $ref: '#/components/schemas/TransactionHints'
          title: Transaction Hints
          description: Optional customer-supplied hints about transaction intent that cannot be inferred from on-chain simulation.
      type: object
      required:
      - chain
      - metadata
      - account_address
      - data
      title: RawTransactionRequest
    ApprovalsSupportedChains:
      type: string
      enum:
      - ethereum
      - polygon
      - bsc
      - avalanche
      - arbitrum
      - base
      - linea
      - kaia
      - optimism
      title: ApprovalsSupportedChains
      description: Supported chain identifiers for the approvals endpoints.
    routers__evm__models__Connection:
      properties:
