          type: string
          title: Usd Price
        value:
          type: string
          title: Value
      type: object
      required:
      - raw_value
      - value
      title: Exposure
    routers__evm__response__CrossChainAssetDiffObject:
      properties:
        chain:
          type: string
          title: Chain
          description: The chain identifier where the asset exists
        asset_type:
          type: string
          title: Asset Type
          description: The type of the asset (e.g. ERC20, NATIVE, FUNGIBLE)
        asset:
          anyOf:
          - $ref: '#/components/schemas/routers__evm__token_details__ERC20TokenDetails'
          - $ref: '#/components/schemas/routers__evm__token_details__ERC721TokenDetails'
          - $ref: '#/components/schemas/routers__evm__token_details__ERC1155TokenDetails'
          - $ref: '#/components/schemas/routers__evm__token_details__NONERCTokenDetails'
          - $ref: '#/components/schemas/routers__evm__token_details__NativeAssetDetails'
          title: Asset
          description: Details of the asset involved in the diff
        in:
          items:
            $ref: '#/components/schemas/routers__evm__response__ERC20Diff'
          type: array
          title: In
          description: Asset value changes received on this chain
        out:
          items:
            $ref: '#/components/schemas/routers__evm__response__ERC20Diff'
          type: array
          title: Out
          description: Asset value changes sent from this chain
      type: object
      required:
      - chain
      - asset_type
      - asset
      - in
      - out
      title: CrossChainAssetDiffObject
      description: An asset diff on a specific chain, with in/out value changes
    routers__evm__response__TransactionScanFeatureType:
      type: string
      enum:
      - Malicious
      - Warning
      - Benign
      - Info
      title: TransactionScanFeatureType
      description: Security result of a transaction scan feature.
    routers__evm__response__ERC20AssetTrace:
      properties:
        trace_type:
          type: string
          enum:
          - AssetTrace
          title: Trace Type
          description: type of the trace
        from_address:
          type: string
          title: From Address
          description: The address where the assets are moved from
        to_address:
          type: string
          title: To Address
          description: The address where the assets are moved to
        labels:
          items:
            anyOf:
            - $ref: '#/components/schemas/routers__evm__response__TraceLabels'
            - type: string
          type: array
          title: Labels
          description: List of labels that describe the trace
        type:
          type: string
          enum:
          - ERC20AssetTrace
          title: Type
          description: The type of the model
        asset:
          anyOf:
          - $ref: '#/components/schemas/routers__evm__token_details__ERC20TokenDetails'
          - $ref: '#/components/schemas/routers__evm__token_details__NONERCTokenDetails'
          title: Asset
          description: Description of the asset in the trace
        diff:
          allOf:
          - $ref: '#/components/schemas/routers__evm__response__ERC20Diff'
          title: Diff
          description: The difference in value for the asset in the trace
      type: object
      required:
