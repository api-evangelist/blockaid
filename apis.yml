aid: blockaid
name: Blockaid
description: >-
  Blockaid is a web3 security platform that detects and prevents scams, fraud,
  financial risk, and smart-contract exploits in real time. Its API scans
  transactions, addresses, tokens, dApp sites, and signed messages across EVM
  chains, Solana, Bitcoin, Stellar, Sui, Starknet, Tron, and Hedera, returning a
  risk verdict that wallets, exchanges, and marketplaces (MetaMask, Coinbase,
  Uniswap, OpenSea) use to block malicious activity before a user signs.
  Products include End User Protection, Onchain Monitoring, Crypto Fraud
  Prevention, the Cosigner policy engine, and compliance Risk Exposure. Backed by
  Greylock, GV, and Ribbit Capital.
